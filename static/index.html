<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>🐼 System Info</title>
    <style>
        body {
            background-color: #2e2e2e;
            color: #ddd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
        }
        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            user-select: none;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 400px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            background: #3a3a3a;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid #555;
            text-align: left;
            font-size: 1.1rem;
        }
        th {
            background-color: #444;
            font-weight: 600;
        }
        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>🐼 System Info</h1>
    <table>
        <tr><th>IP Address</th><td id="ip">Loading...</td></tr>
        <tr><th>CPU Usage</th><td id="cpu">Loading...</td></tr>
        <tr><th>Memory Usage</th><td id="memory">Loading...</td></tr>
        <tr><th>Network Sent</th><td id="net_sent">Loading...</td></tr>
        <tr><th>Network Received</th><td id="net_recv">Loading...</td></tr>
    </table>

<script>
async function fetchData() {
    try {
        const response = await fetch('/api/system');
        const data = await response.json();

        document.getElementById('ip').textContent = data.ip;
        document.getElementById('cpu').textContent = data.cpu + '%';
        document.getElementById('memory').textContent = data.memory + '%';
        document.getElementById('net_sent').textContent = data.net_sent + ' MB';
        document.getElementById('net_recv').textContent = data.net_recv + ' MB';
    } catch (error) {
        console.error('Error fetching data:', error);
    }
}

// Fetch data once at start, then every 5 seconds
fetchData();
setInterval(fetchData, 500);
</script>
</body>
</html>
